# ==========================================
# MOTOR GRÁFICO E PERFORMANCE (GPU)
# ==========================================
backend = "glx";
use-damage = true;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-rebind-pixmap = true;

# ==========================================
# GEOMETRIA: CANTOS ARREDONDADOS (DANK)
# ==========================================
corner-radius = 0;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ==========================================
# PROFUNDIDADE: SOMBRAS (MATERIAL DESIGN)
# ==========================================
shadow = true;
shadow-radius = 18;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.4;
shadow-exclude = [
  "class_g = 'Polybar'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ==========================================
# TRANSIÇÕES E ANIMAÇÕES
# ==========================================
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# ==========================================
# OPACIDADE
# ==========================================
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];

# ==========================================
# COMPORTAMENTO POR TIPO DE JANELA
# ==========================================
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};
