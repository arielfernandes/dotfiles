# ============================================================
# Doom Tomorrow Night theme for i3
# Based on Tomorrow Night (Doom Emacs variant)
# Include this FIRST in config (before bar.conf)
# ============================================================

# Tomorrow Night palette (Doom variant)
set $bg0        #1d1f21
set $bg1        #282a2e
set $bg2        #373b41
set $bg3        #969896
set $fg0        #c5c8c6
set $fg1        #ffffff
set $red        #cc6666
set $orange     #de935f
set $yellow     #f0c674
set $green      #b5bd68
set $aqua       #8abeb7
set $blue       #81a2be
set $purple     #b294bb

# ============================================================
# Window colors
# ============================================================
# class                 border  backgr. text    indicator child_border
client.focused          $blue   $blue   $bg0    $blue     $blue
client.focused_inactive $bg2    $bg2    $fg0    $bg2      $bg2
client.unfocused        $bg0    $bg0    $bg3    $bg0      $bg0
client.urgent           $red    $red    $bg0    $red      $red
client.placeholder      $bg2    $bg2    $bg3    $bg2      $bg2

client.background       $bg0