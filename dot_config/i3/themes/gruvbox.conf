# ============================================================
# Gruvbox Dark Soft theme for i3
# Include this FIRST in config (before bar.conf)
# ============================================================

# Gruvbox Dark Soft palette
set $bg0_h      #1d2021
set $bg0        #282828
set $bg1        #3c3836
set $bg2        #504945
set $bg3        #665c54
set $bg4        #7c6f64
set $fg0        #fbf1c7
set $fg1        #ebdbb2
set $fg2        #d5c4a1
set $fg3        #bdae93
set $fg4        #a89984
set $red        #fb4934
set $orange     #fe8019
set $yellow     #fabd2f
set $green      #b8bb26
set $aqua       #8ec07c
set $blue       #83a598
set $purple     #d3869b

# ============================================================
# Window colors
# ============================================================
# class                 border  backgr. text    indicator child_border
client.focused          $blue   $blue   $fg0    $blue     $blue
client.focused_inactive $bg1    $bg1    $fg3    $bg1      $bg1
client.unfocused        $bg0    $bg0    $fg3    $bg0      $bg0
client.urgent           $red    $red    $fg0    $red      $red
client.placeholder      $bg1    $bg1    $fg3    $bg1      $bg1

client.background       $bg0

# ============================================================
# Bar colors (i3bar) — applied via bar.conf
# ============================================================
# Colors for bar block (defined in bar.conf)
# background $bg0_h
# statusline $fg1
# separator $bg3
# focused_workspace  $yellow $bg0_h $yellow
# active_workspace   $bg1    $bg0_h $fg1
# inactive_workspace $bg1    $bg0_h $fg3
# urgent_workspace   $red    $bg0_h $red
# binding_mode       $orange $bg0_h $orange

# ============================================================
# Other UI colors
# ============================================================
# Menu (rofi, dmenu) - handled by their own themes
# Notification (dunst) - handled by dunstrc