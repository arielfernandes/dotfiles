# ============================================================
# Autostart applications
# Run once on i3 start/restart
# ============================================================

# XDG autostart .desktop files
exec --no-startup-id dex --autostart --environment i3

# Network manager applet
exec --no-startup-id nm-applet

# Emacs daemon
exec --no-startup-id emacs --daemon

# Emacs client frame (opens a visible window)
exec --no-startup-id sh -c 'for i in $(seq 1 30); do emacsclient -e "(emacs-pid)" >/dev/null 2>&1 && break; sleep 1; done; emacsclient -c -a ""'

# Screen lock on sleep
exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.bin/lock.sh

# Notification daemon
exec --no-startup-id dunst

# Bluetooth
exec --no-startup-id blueman-applet

# Compositor (picom) - toggle with $mod+t (see keybindings.conf)
exec --no-startup-id picom --config ~/.config/picom/picom.conf -b


# Wallpaper (example with feh)
# exec --no-startup-id feh --bg-scale ~/Pictures/wallpaper/arch_blue_white.jpg

# Polkit authentication agent
# Paths differ per distro (Arch: /usr/lib, Debian/Mint: /usr/libexec); runs the first one found
exec --no-startup-id sh -c 'for a in /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 /usr/libexec/polkit-gnome-authentication-agent-1 /usr/lib/x86_64-linux-gnu/polkit-mate/polkit-mate-authentication-agent-1 /usr/libexec/polkit-mate-authentication-agent-1; do [ -x "$a" ] && exec "$a"; done'

# Touchpad settings (tap-to-click, natural scrolling)
# Detects any touchpad by name, so it works on every machine (no-op on desktops)
exec_always --no-startup-id sh -c 'xinput list --name-only | grep -i touchpad | while read -r d; do xinput set-prop "$d" "libinput Tapping Enabled" 1; xinput set-prop "$d" "libinput Natural Scrolling Enabled" 1; done'
