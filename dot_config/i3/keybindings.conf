# ============================================================
# Keybindings
# All bindsym definitions in one place
# ============================================================

# Direction variables (defined in config)
# set $up k
# set $down j
# set $left h
# set $right l
# set $vertical v
# set $horizontal semicolon

# ============================================================
# Essentials
# ============================================================
bindsym $mod+Return exec $terminal
bindsym $mod+q kill
bindsym $mod+Shift+q exec xkill
bindsym $mod+Shift+f exec $browser
bindsym $mod+Shift+p exec $filemanager
bindsym $mod+d exec --no-startup-id $launcher
# $mod+e is used for layout toggle split in main config
# bindsym $mod+e exec --no-startup-id $editor

# ============================================================
# Media keys (wireplumber/wpctl)
# ============================================================
bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ============================================================
# Media player (MOC) — $mod+F5
# ============================================================
bindsym $mod+F5 exec --no-startup-id $terminal -e mocp

# ============================================================
# Legacy PulseAudio volume controls (commented — using wpctl above)
# ============================================================
# set $refresh_i3status killall -SIGUSR1 i3status
# bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status
# bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status
# bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
# bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status

# ============================================================
# Focus movement (vim + arrows)
# ============================================================
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# ============================================================
# Move focused window (vim + arrows)
# ============================================================
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# ============================================================
# Split containers
# ============================================================
bindsym $mod+$horizontal split h
bindsym $mod+$vertical split v

# ============================================================
# Layout modes
# ============================================================
bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# ============================================================
# Floating / tiling toggle
# ============================================================
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle

# ============================================================
# Container navigation
# ============================================================
bindsym $mod+a focus parent
# bindsym $mod+d focus child  # unused (d = launcher)

# ============================================================
# Scratchpad
# ============================================================
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# ============================================================
# Bar toggle
# ============================================================
bindsym $mod+m bar mode toggle

# ============================================================
# Config management
# ============================================================
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# ============================================================
# Picom toggle ($mod+t)
# ============================================================
bindsym $mod+t exec --no-startup-id sh -c 'killall -q picom || picom --config ~/.config/picom/picom.conf -b'

# ============================================================
# Gaps mode ($mod+Shift+g) — defined in gaps.conf
# ============================================================
# bindsym $mod+Shift+g mode "$mode_gaps"  # already in gaps.conf

# ============================================================
# Resize mode ($mod+r)
# ============================================================
bindsym $mod+r mode "resize"

# ============================================================
# Dunst controls (using $mod+n prefix to avoid conflicts)
# ============================================================
bindsym $mod+n exec --no-startup-id dunstctl close
bindsym $mod+Shift+n exec --no-startup-id dunstctl close-all
bindsym $mod+Control+n exec --no-startup-id dunstctl history-pop