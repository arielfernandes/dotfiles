[theme]
theme = "semi-native"

[icons]
icons = "awesome4"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = " $icon $available "
warning = 20.0
alert = 10.0

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "

[[block]]
block = "cpu"
interval = 1
format = " $icon $utilization "

[[block]]
block = "load"
interval = 1
format = " $icon  1min avg: $1m.eng(w:4) "

[[block]]
block = "temperature"
format = " $icon $max max "
format_alt = " $icon $min min, $max max, $average avg "
interval = 10
chip = "k10temp-pci-00c3"

[[block]]
block = "backlight"

[[block]]
block = "sound"
driver = "pulseaudio"

[[block]]
block = "time"
interval = 60
format = " $icon $timestamp.datetime(f:'%d/%m/%Y %H:%M') "

[[block]]
block = "battery"
format = " $icon $percentage {$time_remaining.dur(hms:true, min_unit:m) |}"
device = "DisplayDevice"
driver = "upower"
# Sobrescrita dos gatilhos automáticos (exemplo)
warning = 20.0
critical = 10.0
