# ============================================================
# Window rules (for_window)
# Applied when windows appear
# ============================================================

# Default border for all windows
for_window [class="^.*"] border pixel 2

# ============================================================
# Auto-float common dialog/popup types
# ============================================================
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [window_type="notification"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="splash"] floating enable

for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="preferences"] floating enable
for_window [window_role="about"] floating enable

# ============================================================
# Specific apps — float + size/position
# ============================================================
for_window [class="Lxappearance"] floating enable
for_window [class="Nitrogen"] floating enable, resize set 800 600, move position center, sticky enable, border none
for_window [class="pavucontrol"] floating enable, resize set 800 600, move position center, sticky enable, border none
for_window [class="Nm-connection-editor"] floating enable, resize set 800 600, move position center
for_window [class="Gimp"] floating enable
for_window [class="steam"] floating enable

for_window [class="Pcmanfm"] floating enable, resize set 800 600, move position center
for_window [class="org.gnome.Nautilus"] floating enable, resize set 800 600, move position center
for_window [class="Blueman-manager"] floating enable, resize set 800 600, move position center

# ============================================================
# Generic calculator rule (pega qalculate, speedcrunch, kcalc, etc)
# ============================================================
for_window [class=".*[Cc]alculator.*"] floating enable, resize set 400 500, move position center
for_window [class=".*[Qq]alculate.*"] floating enable, resize set 400 500, move position center

# ============================================================
# Floating with no border (clean look for dialogs)
# ============================================================
for_window [window_role="dialog"] border none
for_window [window_role="task_dialog"] border none

