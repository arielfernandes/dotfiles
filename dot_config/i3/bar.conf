# ============================================================
# i3bar configuration (i3status-rs)
# ============================================================

bar {
    position top
    font pango:Hack Nerd Font 11
    status_command i3status-rs ~/.config/i3/status.toml

    colors {
        background #1d1f21
        statusline #c5c8c6
        separator #373b41
        focused_workspace  #81a2be #1d1f21 #81a2be
        active_workspace   #373b41 #1d1f21 #c5c8c6
        inactive_workspace #373b41 #1d1f21 #969896
        urgent_workspace   #cc6666 #1d1f21 #cc6666
        binding_mode       #de935f #1d1f21 #de935f
    }
}