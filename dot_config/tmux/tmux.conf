# --- Configurações Gerais ---
# Habilita modo de navegação com teclas do Vi
set-window-option -g mode-keys vi
# Desabilita renomeação automática de janelas para manter os nomes definidos
set-window-option -g automatic-rename off
set-option -g allow-rename off

# Altera o prefixo padrão de C-b para C-x
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Suporte a Cores 24-bit (TrueColor) e Performance
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0
set -g focus-events on

# Renumera as janelas quando uma é fechada
set-option -g renumber-windows on
# Aumenta o histórico de scrollback
set-option -g history-limit 50000

# Habilita o uso do mouse
set -g mouse on

# Começa a contagem de janelas e painéis do 1 em vez do 0
set -g base-index 1
setw -g pane-base-index 1

# <prefix> r (reload) - Recarrega o tmux.conf de forma síncrona
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded 🌀..."

# <prefix> Ctrl+f - Alternador interativo de janelas/sessões via popup fzf
bind C-f display-popup -E -w 75% -h 60% "\
  tmux list-windows -a -F '##S:##I - ##W' | \
  fzf --reverse | \
  cut -d' ' -f1 | \
  xargs -r tmux switch-client -t"

# --- Atalhos de Teclado (Keybindings) ---
# Inicia a busca no modo de cópia (para trás/histórico)
bind-key / copy-mode \; send-key ?
bind-key KP/ copy-mode \; send-key ?
bind-key -T copy-mode-vi / send-keys ?
bind-key -T copy-mode-vi KP/ send-keys ?

# Popups úteis
bind-key C-p display-popup -E -w 60% -h 60% "ipython"
bind-key C-h display-popup -E -w 80% -h 80% "btop"
# <prefix> Ctrl+t (terminal) - Abre terminal no diretório atual em um popup
bind-key C-t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# <prefix> Ctrl+j (just run) - Roda o just com recipe run (ESC sai)
bind-key C-j display-popup -w 80% -h 80% "just run"

# Atalhos SEM PREFIXO para navegar entre janelas com Alt+Número e Alt+n/p
bind -n M-n select-window -n
bind -n M-p select-window -p
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Atalho para salvar o conteúdo de um painel em um arquivo temporário
bind-key v run-shell "tmux capture-pane -pJ -S- -E- | sed -E 's| *$||' > /tmp/tmux" \; display-message "Buffer saved to /tmp/tmux!"

# --- Plugins (Gerenciados pelo TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # Restauração automática
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'janoamaral/tokyo-night-tmux' # Tema Tokyo Night

# Configuração do Continuum
set -g @continuum-restore 'on' # Habilita a restauração automática ao iniciar o tmux
set -g @continuum-save-interval '5' # Salva a cada 5min

# --- Configurações do Tokyo Night ---
set -g @tokyo-night-tmux_theme night # night | storm | moon | day
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format DMY
set -g @tokyo-night-tmux_time_format 24H
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_show_battery_widget 1

# --- Inicialização do TPM ---
# (Deve ser a ÚLTIMA linha do arquivo)
run '~/.config/tmux/plugins/tpm/tpm'
